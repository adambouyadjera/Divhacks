<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3eb" />
    <title>Oddly — a little less ordinary.</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="app-brand" href="#" aria-label="App Name Goes Here home">
        <span class="app-logo-placeholder" aria-hidden="true">◇</span>
        <span>App Name Goes Here</span>
      </a>
    </header>

    <main>
      <section class="hero" aria-label="Colorful playground illustration">
        <div
          class="artboard"
          aria-label="Playful abstract illustration with colorful geometric shapes"
        >
          <div class="art-grid"></div>
          <div class="art-caption">FIG. 01 — ORGANIZED CHAOS</div>
          <div class="sticker">100%<br /><strong>good weird.</strong></div>
          <div class="flower">
            <div class="flower-center"><span></span><span></span><i></i></div>
          </div>
          <div class="blue-block">
            <div class="eyes"><span></span><span></span></div>
          </div>
          <div class="orange-orbit"></div>
          <div class="pink-pill"><span>oh, hello!</span><span>↗</span></div>
          <div class="lime-star">✳</div>
          <div class="black-spark">✦</div>
          <span class="art-footer">MADE OF POSSIBILITIES <span>＋</span></span>
        </div>
      </section>

      <section class="playground section-wrap" id="playground">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Our Content Goes Below here</p>
            <h2>header goes here</h2>
          </div>
          <span class="section-index">(01 — 03)</span>
        </div>
        <div class="cards">
          <button
            class="card card-lime"
            type="button"
            data-message="Every big idea starts with a little ‘what if?’ Keep going."
          >
            <div class="card-top">
              <span>01 / THE IDEAS</span><span class="round-arrow">↗</span>
            </div>
            <div class="card-art squiggle" aria-hidden="true">✳</div>
            <h3>Lorem ipsum dolor.</h3>
            <p>Small sparks. Unexpected connections. A whole lot of what if.</p>
            <span class="card-link">Find your spark ↗</span>
          </button>
          <button
            class="card card-lilac"
            type="button"
            data-message="Try something imperfect today. Happy accidents are welcome here."
          >
            <div class="card-top">
              <span>02 / THE EXPERIMENTS</span
              ><span class="round-arrow">↗</span>
            </div>
            <div class="card-art loops" aria-hidden="true">
              <i></i><i></i><i></i>
            </div>
            <h3>Sit amet, consectetur.</h3>
            <p>
              A little making, a little breaking. That’s where the fun begins.
            </p>
            <span class="card-link">Try something new ↗</span>
          </button>
          <button
            class="card card-peach"
            type="button"
            data-message="You found your people: curious minds, colorful ideas, and room to be yourself."
          >
            <div class="card-top">
              <span>03 / THE GOOD COMPANY</span
              ><span class="round-arrow">↗</span>
            </div>
            <div class="card-art face" aria-hidden="true">
              <span>• •</span><i></i>
            </div>
            <h3>Adipiscing elit, hello.</h3>
            <p>Different perspectives. Shared curiosity. Better together.</p>
            <span class="card-link">Meet your kind of weird ↗</span>
          </button>
        </div>
      </section>

      <section class="about section-wrap" id="about">
        <span class="about-spark" aria-hidden="true">✳</span>
        <p>end of content page</p>
        <span>a community website<br />know whats happening near you</span>
      </section>
    </main>
    <footer>
      <a class="logo" href="#">Name goes here!<span>✳</span></a
      ><span>replace with something</span
    </footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
